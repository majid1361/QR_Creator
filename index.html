<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QR Studio Pro Max</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR Studio Pro Max" />
  
  <!-- CDN Scripts & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 75%, #000000 100%);
      background-attachment: fixed;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel {
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
    }
  </style>
</head>

<body class="text-slate-100 min-h-screen p-3 sm:p-6 md:p-8 flex flex-col items-center justify-start antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Mobile Install Banner -->
  <div id="install-banner" class="hidden w-full max-w-4xl mb-4 glass-card border-cyan-500/30 rounded-2xl p-3.5 flex items-center justify-between shadow-2xl transition-all">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-lg font-bold">
        ⚡
      </div>
      <div>
        <h4 class="font-bold text-xs sm:text-sm text-slate-200">نصب نسخه اپلیکیشن (PWA)</h4>
        <p class="text-[10px] sm:text-xs text-slate-400">دسترسی سریع و بدون نیاز به اینترنت</p>
      </div>
    </div>
    <button id="btn-install" class="px-3.5 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/20 active:scale-95 transition">
      نصب اپ
    </button>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-4xl space-y-4 sm:space-y-6">
    
    <!-- Top Header -->
    <header class="text-center space-y-1.5 relative">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-300 text-[11px] font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        تولید حرفه ای کیوآر با پشتیبانی هوشمند از کلیه فرمت‌ها
      </div>
      <h1 class="text-2xl sm:text-4xl font-black bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent tracking-tight">
        QR Studio Pro Max
      </h1>
    </header>

    <!-- Sleek Compact Dropdown for Categories -->
    <div class="relative z-30" id="type-dropdown-container">
      <label class="block text-xs font-bold text-slate-400 mb-1.5 mr-1">نوع بارکد QR مورد نظر:</label>
      <button id="dropdown-toggle" type="button" class="w-full glass-card hover:border-cyan-500/50 rounded-2xl p-3.5 px-4 flex items-center justify-between text-slate-100 shadow-xl transition active:scale-[0.99] border border-slate-700/60">
        <div class="flex items-center gap-3">
          <span id="selected-icon" class="text-xl">🔗</span>
          <div class="text-right">
            <span id="selected-label" class="font-bold text-sm sm:text-base text-cyan-300">وب‌سایت و لینک اینترنتی</span>
            <span class="text-[10px] text-slate-400 block sm:inline sm:mr-2">برای تغییر کلیک کنید</span>
          </div>
        </div>
        <div class="w-8 h-8 rounded-xl bg-slate-800/80 flex items-center justify-center text-cyan-400 text-xs transition duration-200" id="dropdown-arrow">
          ▼
        </div>
      </button>

      <!-- Dropdown Items Menu -->
      <div id="dropdown-menu" class="hidden absolute top-full right-0 left-0 mt-2 glass-panel border border-slate-700/80 rounded-2xl p-2 shadow-2xl z-40 max-h-80 overflow-y-auto backdrop-blur-2xl grid grid-cols-1 sm:grid-cols-2 gap-1.5">
        
        <button data-type="url" data-icon="🔗" data-title="وب‌سایت و لینک اینترنتی" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">🔗</span>
          <div>
            <div class="text-xs font-bold text-slate-100">وب‌سایت یا آدرس URL</div>
            <div class="text-[10px] text-slate-400">لینک مستقیم اینترنتی</div>
          </div>
        </button>

        <button data-type="bank" data-icon="💳" data-title="اطلاعات حساب بانکی و کارت" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">💳</span>
          <div>
            <div class="text-xs font-bold text-slate-100">اطلاعات حساب بانکی</div>
            <div class="text-[10px] text-slate-400">کارت، شماره شبا و حساب</div>
          </div>
        </button>

        <button data-type="text" data-icon="📝" data-title="متن دلخواه یا یادداشت" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📝</span>
          <div>
            <div class="text-xs font-bold text-slate-100">متن دلخواه (Text)</div>
            <div class="text-[10px] text-slate-400">پیام، شعر، یادداشت</div>
          </div>
        </button>

        <button data-type="wifi" data-icon="📶" data-title="اتصال خودکار به شبکه وای‌فای" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📶</span>
          <div>
            <div class="text-xs font-bold text-slate-100">وای‌فای (Wi-Fi)</div>
            <div class="text-[10px] text-slate-400">اتصال سریع بدون تایپ رمز</div>
          </div>
        </button>

        <button data-type="phone" data-icon="📞" data-title="شماره‌گیری مستقیم تماس" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📞</span>
          <div>
            <div class="text-xs font-bold text-slate-100">شماره تلفن (Call)</div>
            <div class="text-[10px] text-slate-400">شماره‌گیری سریع تماس</div>
          </div>
        </button>

        <button data-type="sms" data-icon="💬" data-title="ارسال پیامک آماده (SMS)" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">💬</span>
          <div>
            <div class="text-xs font-bold text-slate-100">پیامک (SMS)</div>
            <div class="text-[10px] text-slate-400">متن و شماره آماده</div>
          </div>
        </button>

        <button data-type="email" data-icon="✉️" data-title="ارسال ایمیل هوشمند" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">✉️</span>
          <div>
            <div class="text-xs font-bold text-slate-100">ایمیل (Email)</div>
            <div class="text-[10px] text-slate-400">گیرنده، موضوع و متن</div>
          </div>
        </button>

        <button data-type="vcard" data-icon="👤" data-title="کارت ویزیت مخاطب (vCard)" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">👤</span>
          <div>
            <div class="text-xs font-bold text-slate-100">مخاطب (vCard)</div>
            <div class="text-[10px] text-slate-400">ذخیره خودکار در مخاطبین</div>
          </div>
        </button>

        <button data-type="location" data-icon="📍" data-title="موقعیت جغرافیایی نقشه" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📍</span>
          <div>
            <div class="text-xs font-bold text-slate-100">لوکیشن (Map)</div>
            <div class="text-[10px] text-slate-400">مسیریابی با گوگل مپ</div>
          </div>
        </button>

        <button data-type="event" data-icon="📅" data-title="ثبت رویداد در تقویم" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📅</span>
          <div>
            <div class="text-xs font-bold text-slate-100">رویداد (Calendar)</div>
            <div class="text-[10px] text-slate-400">زمان‌بندی و جلسه</div>
          </div>
        </button>

        <button data-type="crypto" data-icon="🪙" data-title="کیف پول ارز دیجیتال" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">🪙</span>
          <div>
            <div class="text-xs font-bold text-slate-100">کریپتو (Crypto)</div>
            <div class="text-[10px] text-slate-400">بیت‌کوین، تتر و اتریوم</div>
          </div>
        </button>

      </div>
    </div>

    <!-- Main Workspace Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 glass-card rounded-3xl p-4 sm:p-6 shadow-2xl relative z-10">
      
      <!-- Input Controls (Column 1) -->
      <div class="lg:col-span-7 space-y-4">
        
        <!-- Dynamic Forms Container -->
        <div class="glass-panel p-4 rounded-2xl border border-slate-800/80 shadow-inner">
          
          <!-- 1. URL -->
          <div id="form-url" class="type-form space-y-2">
            <label class="block text-xs font-bold text-slate-300">آدرس وب‌سایت یا لینک اینترنتی</label>
            <input type="text" id="input-url" placeholder="https://example.com" value="" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 text-white text-left font-mono text-xs sm:text-sm transition" />
          </div>

          <!-- 2. BANK -->
          <div id="form-bank" class="type-form hidden space-y-3">
            <label class="block text-xs font-bold text-slate-300">اطلاعات حساب بانکی و کارت</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="bank-holder" placeholder="نام صاحب حساب" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="text" id="bank-name" placeholder="نام بانک (مثلاً ملت)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            </div>
            <div class="space-y-2">
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">شماره کارت (۱۶ رقمی):</label>
                <input type="text" id="bank-card" placeholder="6037-xxxx-xxxx-xxxx" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs sm:text-sm transition tracking-wider" />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1">شماره حساب:</label>
                  <input type="text" id="bank-acc" placeholder="شماره حساب" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs sm:text-sm transition" />
                </div>
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1">شماره شبا (IBAN):</label>
                  <input type="text" id="bank-iban" placeholder="IR000000000000000000000000" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs sm:text-sm transition" />
                </div>
              </div>
            </div>
          </div>

          <!-- 3. TEXT -->
          <div id="form-text" class="type-form hidden space-y-2">
            <label class="block text-xs font-bold text-slate-300">متن دلخواه یا توضیحات</label>
            <textarea id="input-text" rows="3" placeholder="متن مورد نظرتان را اینجا بنویسید..." class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
          </div>

          <!-- 4. WIFI -->
          <div id="form-wifi" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">مشخصات شبکه وای‌فای</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="wifi-ssid" placeholder="نام شبکه (SSID)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="text" id="wifi-pass" placeholder="رمز عبور وای‌فای" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            </div>
            <div class="flex items-center gap-4 text-xs text-slate-300 pt-1">
              <span class="font-semibold text-slate-400">امنیت:</span>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="wifi-type" value="WPA" checked class="text-cyan-500" />
                <span>WPA/WPA2</span>
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="wifi-type" value="WEP" class="text-cyan-500" />
                <span>WEP</span>
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="wifi-type" value="nopass" class="text-cyan-500" />
                <span>بدون رمز</span>
              </label>
            </div>
          </div>

          <!-- 5. PHONE -->
          <div id="form-phone" class="type-form hidden space-y-2">
            <label class="block text-xs font-bold text-slate-300">شماره تماس جهت شماره‌گیری مستقیم</label>
            <input type="tel" id="input-phone" placeholder="0912xxxxxxx" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
          </div>

          <!-- 6. SMS -->
          <div id="form-sms" class="type-form hidden space-y-2">
            <label class="block text-xs font-bold text-slate-300">ارسال پیامک آماده</label>
            <input type="tel" id="sms-phone" placeholder="شماره گیرنده" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm mb-1.5 transition" />
            <textarea id="sms-body" rows="2" placeholder="متن پیش‌فرض پیامک..." class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
          </div>

          <!-- 7. EMAIL -->
          <div id="form-email" class="type-form hidden space-y-2">
            <label class="block text-xs font-bold text-slate-300">ارسال ایمیل</label>
            <input type="email" id="email-to" placeholder="آدرس ایمیل گیرنده" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm mb-1 transition" />
            <input type="text" id="email-subject" placeholder="موضوع ایمیل" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm mb-1 transition" />
            <textarea id="email-body" rows="2" placeholder="متن ایمیل..." class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
          </div>

          <!-- 8. VCARD -->
          <div id="form-vcard" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">کارت ویزیت مخاطب (vCard)</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="vcard-fn" placeholder="نام و نام خانوادگی" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <div id="vcard-phones" class="space-y-2.5"></div>
              <button type="button" id="add-vcard-phone" class="col-span-1 sm:col-span-2 flex items-center justify-center gap-2 py-2 rounded-xl border border-dashed border-cyan-400/50 text-cyan-300 text-xs font-bold hover:bg-cyan-500/10 transition">➕ افزودن شماره تماس</button>
              <input type="email" id="vcard-email" placeholder="ایمیل" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left text-xs sm:text-sm transition" />
              <input type="text" id="vcard-org" placeholder="نام شرکت / سازمان" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="text" id="vcard-title" placeholder="عنوان شغلی" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="url" id="vcard-website" placeholder="وب‌سایت (https://example.com)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="url" id="vcard-instagram" placeholder="اینستاگرام (لینک پروفایل)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="url" id="vcard-whatsapp" placeholder="واتساپ (لینک wa.me)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="url" id="vcard-telegram" placeholder="تلگرام (لینک t.me)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="url" id="vcard-bale" placeholder="بله (لینک پروفایل / گفتگو)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="url" id="vcard-eitaa" placeholder="ایتا (لینک پروفایل / گفتگو)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="url" id="vcard-location" placeholder="لوکیشن به صورت لینک (Google Maps)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <textarea id="vcard-bio" rows="2" placeholder="توضیحات / بیو" class="sm:col-span-2 w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
            </div>
          </div>

          <!-- 9. LOCATION -->
          <div id="form-location" class="type-form hidden space-y-2">
            <label class="block text-xs font-bold text-slate-300">مختصات نقشه</label>
            <div class="grid grid-cols-2 gap-2.5">

            <input type="text" id="crypto-amount" placeholder="مقدار رمزارز (اختیاری)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs transition" />

        <!-- Styles Selector -->
        <div class="grid grid-cols-2 gap-3">
          <div>

            <label class="block text-xs font-bold text-slate-300 mb-1.5">طرح گوشه‌ها (Corners)</label>

              <option value="extra-rounded" selected>گوشه‌های کاملاً گرد</option>

        <!-- Margin & Resolution -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">حاشیه امن (Quiet Zone)</label>
            <select id="qr-margin" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700/70 rounded-xl text-slate-200 text-xs sm:text-sm transition">
              <option value="15">حاشیه ملایم (15px)</option>
              <option value="25" selected>حاشیه استاندارد (25px)</option>
              <option value="35">حاشیه عریض (35px)</option>
              <option value="0">بدون حاشیه (0px)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">کیفیت خروجی (رزولوشن)</label>
            <select id="qr-size" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700/70 rounded-xl text-slate-200 text-xs sm:text-sm transition">
              <option value="1200">مناسب وب - 1200px</option>
              <option value="2000" selected>مناسب چاپ - 2000px</option>
              <option value="3000">اولترا HD بنر - 3000px</option>
            </select>

        <!-- Color Palette -->
        <div class="grid grid-cols-2 gap-3">

              <input type="color" id="qr-color" value="#000000" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border border-slate-700/80" />
              <span id="qr-color-val" class="font-mono text-xs text-slate-300 uppercase font-semibold">#000000</span>

              <input type="color" id="bg-color" value="#ffffff" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border border-slate-700/80" />

            </div>

        <!-- Center Logo Upload Box -->
        <div class="glass-panel p-3 rounded-2xl border border-dashed border-slate-700/80 flex items-center justify-between">

            <span class="text-[10px] text-slate-400">تصویر وسط QR کد (اختیاری)</span>
          </div>
          <div class="flex items-center gap-2">
            <label class="cursor-pointer px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-semibold rounded-xl border border-cyan-500/30 active:scale-95 transition">
              <span>انتخاب فایل</span>
              <input type="file" id="logo-input" accept="image/*" class="hidden" />
            </label>
            <button id="remove-logo" type="button" class="hidden px-2.5 py-1.5 bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 text-xs rounded-xl border border-rose-500/30 transition">
              حذف
            </button>
          </div>

      </div>

      <!-- Live Preview & Output (Column 2) -->
      <div class="lg:col-span-5 flex flex-col items-center justify-between glass-panel rounded-2xl p-5 border border-slate-800/90">
        
        <div class="w-full flex flex-col items-center gap-3">
          <div class="w-full flex items-center justify-between px-1">
            <span class="text-xs font-bold text-slate-300">پیش‌نمایش زنده</span>
            <span class="text-[10px] font-mono bg-cyan-950/80 text-cyan-400 px-2 py-0.5 rounded-full border border-cyan-500/30 font-bold">HQ Vector</span>
          </div>

          <!-- QR Canvas Container -->
          <div class="p-3 bg-slate-900/90 rounded-3xl glow-cyan flex items-center justify-center max-w-[260px] w-full aspect-square border border-slate-700/60 transition-all duration-300 overflow-hidden" id="canvas-container">
            <!-- QR Generated Here -->
          </div>
        </div>

        <!-- Download & Actions -->
        <div class="w-full mt-5 space-y-2.5">
          <div class="flex gap-2">
            <button id="btn-png" type="button" class="flex-1 py-3 bg-gradient-to-r from-cyan-400 to-sky-500 hover:from-cyan-300 hover:to-sky-400 text-slate-950 font-black rounded-xl shadow-lg shadow-cyan-500/25 active:scale-95 transition text-xs sm:text-sm flex items-center justify-center gap-1">
              <span>دانلود (PNG)</span>
            </button>
            <button id="btn-svg" type="button" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold rounded-xl border border-slate-700/80 active:scale-95 transition text-xs sm:text-sm flex items-center justify-center gap-1">
              <span>وکتور (SVG)</span>
            </button>
          </div>
          
          <button id="btn-copy" type="button" class="w-full py-2 bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800 rounded-xl text-xs font-semibold transition active:scale-95">
            📋 کپی متن/محتوای QR
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    let activeType = "url";
    let logoDataUrl = "";
    let deferredPrompt = null;

    // تبدیل هوشمند ارقام فارسی و عربی به انگلیسی
    function toEnglishDigits(str) {
      if (!str) return "";
      const persianDigits = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
      const arabicDigits  = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
      let result = str.toString();
      for (let i = 0; i < 10; i++) {
        result = result.replace(persianDigits[i], i).replace(arabicDigits[i], i);
      }
      return result;
    }

    // راهکار قطعی رفع علامت سوال: انکود بایت‌های فارسی/یونیکد برای موتور QR
    function fixPersian(str) {
      if (!str) return "";
      try {
        return unescape(encodeURIComponent(str));
      } catch (e) {
        return str;
      }
    }

    // PWA Install Prompt Handler
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('btn-install').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-banner').classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    // Custom Dropdown Logic
    const dropdownToggle = document.getElementById("dropdown-toggle");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const dropdownArrow = document.getElementById("dropdown-arrow");
    const selectedIcon = document.getElementById("selected-icon");
    const selectedLabel = document.getElementById("selected-label");

    dropdownToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const isHidden = dropdownMenu.classList.contains("hidden");
      if (isHidden) {
        dropdownMenu.classList.remove("hidden");
        dropdownArrow.style.transform = "rotate(180deg)";
      } else {
        dropdownMenu.classList.add("hidden");
        dropdownArrow.style.transform = "rotate(0deg)";
      }
    });

    // Close Dropdown on outer click
    document.addEventListener("click", () => {
      dropdownMenu.classList.add("hidden");
      dropdownArrow.style.transform = "rotate(0deg)";
    });

    // Dropdown items click
    const dropdownItems = document.querySelectorAll(".dropdown-item");
    dropdownItems.forEach(item => {
      item.addEventListener("click", () => {
        activeType = item.getAttribute("data-type");
        const icon = item.getAttribute("data-icon");
        const title = item.getAttribute("data-title");

        selectedIcon.textContent = icon;
        selectedLabel.textContent = title;

        // Hide all forms and show active one
        document.querySelectorAll(".type-form").forEach(f => f.classList.add("hidden"));
        const targetForm = document.getElementById(`form-${activeType}`);
        if (targetForm) targetForm.classList.remove("hidden");

        // Close dropdown
        dropdownMenu.classList.add("hidden");
        dropdownArrow.style.transform = "rotate(0deg)";

        updateQR();
      });
    });

    // Format Generator for Standards (WiFi, SMS, vCard, Bank, etc.)
    function getFormattedPayload() {
      switch(activeType) {
        case "url": {
          const val = document.getElementById("input-url").value.trim();
          return val || "https://";
        }
        case "bank": {
          const bHolder = document.getElementById("bank-holder").value.trim();
          const bBank = document.getElementById("bank-name").value.trim();
          const bCard = toEnglishDigits(document.getElementById("bank-card").value.trim().replace(/[\s-]/g, ''));
          const bAcc = toEnglishDigits(document.getElementById("bank-acc").value.trim());
          let bIban = toEnglishDigits(document.getElementById("bank-iban").value.trim().replace(/\s/g, '')).toUpperCase();
          if (bIban && !bIban.startsWith("IR")) {
            bIban = "IR" + bIban;
          }

          let bankLines = [];
          if (bHolder) bankLines.push(`صاحب حساب: ${bHolder}`);
          if (bBank) bankLines.push(`بانک: ${bBank}`);
          if (bCard) {
            const formattedCard = bCard.match(/.{1,4}/g)?.join(' ') || bCard;
            bankLines.push(`شماره کارت:\n${formattedCard}`);
          }
          if (bAcc) bankLines.push(`شماره حساب:\n${bAcc}`);
          if (bIban) bankLines.push(`شماره شبا:\n${bIban}`);

          return bankLines.length > 0 ? bankLines.join("\n\n") : "اطلاعات حساب بانکی";
        }
        case "text": {
          return document.getElementById("input-text").value.trim() || " ";
        }
        case "wifi": {
          const ssid = document.getElementById("wifi-ssid").value.trim();
          const pass = document.getElementById("wifi-pass").value.trim();
          const enc = document.querySelector('input[name="wifi-type"]:checked')?.value || 'WPA';
          return `WIFI:T:${enc};S:${ssid};P:${pass};;`;
        }
        case "phone": {
          const tel = toEnglishDigits(document.getElementById("input-phone").value.trim().replace(/[\s-]/g, ''));
          return tel ? `tel:${tel}` : "tel:";
        }
        case "sms": {
          const smsNum = toEnglishDigits(document.getElementById("sms-phone").value.trim().replace(/[\s-]/g, ''));
          const smsBody = document.getElementById("sms-body").value.trim();
          return `SMSTO:${smsNum}:${smsBody}`;
        }
        case "email": {
          const to = document.getElementById("email-to").value.trim();
          const sub = encodeURIComponent(document.getElementById("email-subject").value.trim());
          const body = encodeURIComponent(document.getElementById("email-body").value.trim());
          return `mailto:${to}?subject=${sub}&body=${body}`;
        }
        case "vcard": {
          // RFC 6350-style escaping/folding, serialized as a vCard 3.0 text with CRLF lines.
          const get = id => document.getElementById(id).value.trim();
          const escapeText = value => String(value || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
          const lines = ["BEGIN:VCARD", "VERSION:3.0"];
          const fn = get("vcard-fn") || "بدون نام";
          lines.push(`FN;CHARSET=UTF-8:${escapeText(fn)}`);
          lines.push(`N;CHARSET=UTF-8:${escapeText(fn)};;;;`);
          const org = get("vcard-org");
          const title = get("vcard-title");
          if (org) lines.push(`ORG;CHARSET=UTF-8:${escapeText(org)}`);
          if (title) lines.push(`TITLE;CHARSET=UTF-8:${escapeText(title)}`);
          [...document.querySelectorAll("#vcard-phones input")]
            .map(i => toEnglishDigits(i.value.trim()))
            .filter(Boolean)
            .forEach(phone => lines.push(`TEL;TYPE=CELL:${escapeText(phone)}`));
          const email = get("vcard-email");
          if (email) lines.push(`EMAIL;TYPE=INTERNET:${escapeText(email)}`);
          // Social profiles and the map are encoded as URL properties (vCard 3.0-compatible).
          [["vcard-website", "WORK"], ["vcard-instagram", "X-INSTAGRAM"],
           ["vcard-whatsapp", "X-WHATSAPP"], ["vcard-telegram", "X-TELEGRAM"],
           ["vcard-bale", "X-BALE"], ["vcard-eitaa", "X-EITAA"],
           ["vcard-location", "X-LOCATION"]].forEach(([id, type]) => {
            const url = get(id);
            if (url) lines.push(`URL;TYPE=${type}:${url.replace(/[\r\n]/g, "")}`);
          });
          const bio = get("vcard-bio");
          if (bio) lines.push(`NOTE;CHARSET=UTF-8:${escapeText(bio)}`);
          lines.push("END:VCARD");
          // vCard physical lines are limited to 75 UTF-8 octets; continuation lines start with one space.
          const folded = [];
          for (const line of lines) {
            let part = "", byteCount = 0;
            for (const char of line) {
              const size = new TextEncoder().encode(char).length;
              if (byteCount + size > (part ? 75 : 74)) { folded.push(part); part = " " + char; byteCount = 1 + size; }
              else { part += char; byteCount += size; }
            }
            folded.push(part);
          }
          return folded.join("\r\n");
        }
        case "location": {
          const lat = toEnglishDigits(document.getElementById("loc-lat").value.trim()) || "35.6892";
          const lng = toEnglishDigits(document.getElementById("loc-lng").value.trim()) || "51.3890";
          return `https://www.google.com/maps?q=${lat},${lng}`;
        }
        case "event": {
          const title = document.getElementById("event-title").value.trim() || "رویداد";
          const start = (document.getElementById("event-start").value || "").replace(/[-:]/g, "") + "00Z";
          const end = (document.getElementById("event-end").value || "").replace(/[-:]/g, "") + "00Z";
          const eloc = document.getElementById("event-location").value.trim();
          return `BEGIN:VEVENT\nSUMMARY:${title}\nDTSTART:${start}\nDTEND:${end}\nLOCATION:${eloc}\nEND:VEVENT`;
        }
        case "crypto": {
          const coin = document.getElementById("crypto-coin").value;
          const addr = document.getElementById("crypto-address").value.trim();
          const amt = toEnglishDigits(document.getElementById("crypto-amount").value.trim());
          if (coin === "bitcoin") return `bitcoin:${addr}${amt ? '?amount='+amt : ''}`;
          if (coin === "ethereum") return `ethereum:${addr}${amt ? '?value='+amt : ''}`;
          return `${coin}:${addr}${amt ? '?amount='+amt : ''}`;
        }
        default:
          return "https://";
      }
    }

    // Initialize QR Code Styling Engine
    const qrCode = new QRCodeStyling({
      width: 240,
      height: 240,
      margin: parseInt(document.getElementById("qr-margin").value) || 25,
      type: "canvas",
      data: fixPersian(getFormattedPayload()),
      qrOptions: {
        errorCorrectionLevel: 'Q'
      },
      dotsOptions: {
        color: document.getElementById("qr-color").value,
        type: document.getElementById("dots-type").value
      },
      backgroundOptions: {
        color: document.getElementById("bg-color").value,
      },
      cornersSquareOptions: {
        type: document.getElementById("corners-type").value
      },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 4,
        imageSize: 0.35
      }
    });

    const container = document.getElementById("canvas-container");
    qrCode.append(container);

    function updateQR() {
      const payload = getFormattedPayload();
      const marginVal = parseInt(document.getElementById("qr-margin").value) || 0;
      
      qrCode.update({
        data: fixPersian(payload),
        margin: marginVal,
        dotsOptions: {
          color: document.getElementById("qr-color").value,
          type: document.getElementById("dots-type").value
        },
        backgroundOptions: {
          color: document.getElementById("bg-color").value
        },
        cornersSquareOptions: {
          type: document.getElementById("corners-type").value
        },
        image: logoDataUrl || null
      });
    }

    // Inputs Listeners
    document.querySelectorAll("input, select, textarea").forEach(input => {
      input.addEventListener("input", updateQR);
      input.addEventListener("change", updateQR);
    });

    // vCard: Dynamic phone numbers
    const phonesContainer = document.getElementById("vcard-phones");
    const addPhoneBtn = document.getElementById("add-vcard-phone");

    function createPhoneRow() {
      const row = document.createElement("div");
      row.className = "flex items-center gap-2";
      const input = document.createElement("input");
      input.type = "tel";
      input.placeholder = "شماره تماس";
      input.className = "vcard-phone-input flex-1 px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition";
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.textContent = "🗑";
      removeBtn.title = "حذف شماره";
      removeBtn.className = "shrink-0 w-9 h-9 flex items-center justify-center rounded-xl border border-red-500/40 text-red-400 hover:bg-red-500/10 transition";
      removeBtn.addEventListener("click", () => {
        row.remove();
        updateQR();
      });
      input.addEventListener("input", updateQR);
      row.appendChild(input);
      row.appendChild(removeBtn);
      phonesContainer.appendChild(row);
    }

    addPhoneBtn.addEventListener("click", () => {
      createPhoneRow();
      updateQR();
    });

    document.getElementById("qr-color").addEventListener("input", (e) => {
      document.getElementById("qr-color-val").textContent = e.target.value.toUpperCase();
      updateQR();
    });

    document.getElementById("bg-color").addEventListener("input", (e) => {
      document.getElementById("bg-color-val").textContent = e.target.value.toUpperCase();
      updateQR();
    });

    // Logo Upload / Remove Logic
    document.getElementById("logo-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          logoDataUrl = reader.result;
          document.getElementById("remove-logo").classList.remove("hidden");
          updateQR();
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById("remove-logo").addEventListener("click", () => {
      logoDataUrl = "";
      document.getElementById("logo-input").value = "";
      document.getElementById("remove-logo").classList.add("hidden");
      updateQR();
    });

    // Guaranteed High-Resolution Downloads
    document.getElementById("btn-png").addEventListener("click", async () => {
      const btn = document.getElementById("btn-png");
      const originalText = btn.innerHTML;
      btn.innerText = "⏳ در حال آماده‌سازی...";
      
      try {
        const targetSize = parseInt(document.getElementById("qr-size").value) || 2000;
        const currentMargin = parseInt(document.getElementById("qr-margin").value) || 25;
        const exportMargin = Math.round(currentMargin * (targetSize / 240));

        // ارتقای سایز به رزولوشن بالا برای ذخیره‌سازی
        await qrCode.update({
          width: targetSize,
          height: targetSize,
          margin: exportMargin
        });

        await qrCode.download({ name: `qr-${activeType}-${Date.now()}`, extension: "png" });

        // بازگردانی به اندازه پیش‌نمایش در صفحه
        await qrCode.update({
          width: 240,
          height: 240,
          margin: currentMargin
        });
      } catch (err) {
        console.error("Download Error:", err);
      } finally {
        btn.innerHTML = originalText;
      }
    });

    document.getElementById("btn-svg").addEventListener("click", async () => {
      await qrCode.download({ name: `qr-${activeType}-${Date.now()}`, extension: "svg" });
    });

    // Copy Raw QR String
    document.getElementById("btn-copy").addEventListener("click", () => {
      const payload = getFormattedPayload();
      navigator.clipboard.writeText(payload).then(() => {
        const btn = document.getElementById("btn-copy");
        btn.textContent = "✅ در حافظه کپی شد!";
        setTimeout(() => {
          btn.textContent = "📋 کپی متن/محتوای QR";
        }, 2000);
      });
    });

    // Offline Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

      Developed by <span class="font-bold text-slate-400">Majid Ranjbar</span>
    </div>
  </footer>
