<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QR Code Studio Pro</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR Studio" />
  
  <!-- CDN Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
  </style>

  <!-- Manifest Auto-Inject for Instant PWA Support -->
  <script>
    const manifestJSON = {
      name: "QR Code Studio Pro",
      short_name: "QR Studio",
      start_url: "./",
      display: "standalone",
      background_color: "#020617",
      theme_color: "#020617",
      icons: [
        {
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2306b6d4'/><path d='M25 25h20v20h-20zM55 25h20v20h-20zM25 55h20v20h-20zM55 55h10v10h-10zM65 65h10v10h-10z' fill='%23020617'/></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestJSON);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const linkTag = document.createElement('link');
    linkTag.rel = 'manifest';
    linkTag.href = manifestURL;
    document.head.appendChild(linkTag);
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-6 md:p-10 flex flex-col items-center justify-start antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Mobile Install Banner (Hidden by default, shown if installable) -->
  <div id="install-banner" class="hidden w-full max-w-5xl mb-4 bg-gradient-to-r from-cyan-900/60 to-blue-900/60 border border-cyan-500/40 backdrop-blur-md rounded-2xl p-4 flex items-center justify-between shadow-lg animate-pulse">
    <div class="flex items-center gap-3">
      <span class="text-2xl">📱</span>
      <div>
        <p class="font-bold text-sm text-cyan-200">نصب نسخه اپلیکیشن روی گوشی</p>
        <p class="text-xs text-slate-300">بدون نیاز به گوگل‌پلی یا اپ‌استور، سریع و آفلاین</p>
      </div>
    </div>
    <button id="btn-install" class="bg-cyan-400 hover:bg-cyan-300 active:scale-95 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow-md transition">
      نصب روی موبایل
    </button>
  </div>

  <div class="max-w-5xl w-full mx-auto">
    <!-- Header -->
    <header class="text-center mb-6 sm:mb-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-slate-900 border border-slate-800 rounded-full text-xs font-semibold text-cyan-400 mb-3">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        ۱۰۰٪ کلاینت‌ساید و بدون انقضا
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-500 bg-clip-text text-transparent tracking-tight">
        استودیو هوشمند QR کد
      </h1>
      <p class="text-slate-400 mt-2 text-xs sm:text-sm">تولید مستقیم ماتریس وکتوری، بدون سرور واسطه و دائمی</p>
    </header>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-5 sm:p-8 shadow-2xl">
      
      <!-- Input Controls (Column 1) -->
      <div class="lg:col-span-7 space-y-5">
        
        <!-- Text/URL Input -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-2">لینک، متن یا نام‌کاربری</label>
          <div class="relative">
            <input 
              type="text" 
              id="qr-data" 
              placeholder="https://instagram.com/your-id" 
              value="https://github.com" 
              class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-700/80 rounded-2xl focus:ring-2 focus:ring-cyan-400 focus:outline-none text-white text-left font-mono text-sm shadow-inner transition"
            />
            <span class="absolute left-3 top-3.5 text-slate-500 text-sm">🔗</span>
          </div>
        </div>

        <!-- Styles Selector -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-2">فرم نقطه‌ها (Dots)</label>
            <select id="dots-type" class="w-full px-3.5 py-3 bg-slate-950 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-cyan-400 text-slate-200 text-sm transition">
              <option value="rounded" selected>مدرن و گرد (Rounded)</option>
              <option value="dots">دایره کامل (Dots)</option>
              <option value="classy">زاویه‌دار کلاسیک (Classy)</option>
              <option value="extra-rounded">فوق گرد (Smooth)</option>
              <option value="square">مربعی پیش‌فرض (Square)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-2">طرح ۳ گوشه (Corners)</label>
            <select id="corners-type" class="w-full px-3.5 py-3 bg-slate-950 border border-slate-700/80 rounded-xl focus:ring-2 focus:ring-cyan-400 text-slate-200 text-sm transition">
              <option value="extra-rounded" selected>گوشه نیم‌گرد</option>
              <option value="dot">گوشه دایره‌ای</option>
              <option value="square">گوشه تیز هندسی</option>
            </select>
          </div>
        </div>

        <!-- Color Palette -->
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
            <label class="block text-xs font-semibold text-slate-400 mb-2">رنگ ماتریس</label>
            <div class="flex items-center gap-3">
              <input type="color" id="qr-color" value="#06b6d4" class="w-10 h-10 rounded-xl cursor-pointer bg-transparent border border-slate-700" />
              <span id="qr-color-val" class="font-mono text-xs text-slate-300 uppercase">#06b6d4</span>
            </div>
          </div>

          <div class="bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
            <label class="block text-xs font-semibold text-slate-400 mb-2">رنگ پس‌زمینه</label>
            <div class="flex items-center gap-3">
              <input type="color" id="bg-color" value="#ffffff" class="w-10 h-10 rounded-xl cursor-pointer bg-transparent border border-slate-700" />
              <span id="bg-color-val" class="font-mono text-xs text-slate-300 uppercase">#ffffff</span>
            </div>
          </div>
        </div>

        <!-- Center Logo Upload -->
        <div class="bg-slate-950/50 p-4 rounded-2xl border border-dashed border-slate-700">
          <div class="flex items-center justify-between">
            <div>
              <span class="block text-xs font-bold text-slate-200">آیکون یا لوگوی اختصاصی</span>
              <span class="block text-[11px] text-slate-400 mt-0.5">در مرکز QR کد بدون افت کیفیت نمایش داده می‌شود</span>
            </div>
            <div class="flex items-center gap-2">
              <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-600 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 active:scale-95">
                <span>انتخاب لوگو</span>
                <input type="file" id="logo-input" accept="image/*" class="hidden" />
              </label>
              <button id="remove-logo" class="hidden text-xs bg-rose-950/60 border border-rose-800 text-rose-400 px-3 py-2 rounded-xl hover:bg-rose-900 transition">
                حذف
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- Live Preview & Output (Column 2) -->
      <div class="lg:col-span-5 flex flex-col items-center justify-between border-t lg:border-t-0 lg:border-r border-slate-800/80 pt-6 lg:pt-0 lg:pr-8">
        
        <div class="w-full flex flex-col items-center">
          <div class="flex items-center justify-between w-full max-w-[290px] mb-3">
            <span class="text-xs font-bold text-slate-400">پیش‌نمایش لحظه‌ای</span>
            <span class="text-[10px] bg-slate-800 text-cyan-300 px-2 py-0.5 rounded-full font-mono">260px</span>
          </div>

          <div class="p-4 bg-white rounded-3xl shadow-2xl flex items-center justify-center max-w-[290px] w-full aspect-square border border-slate-200 transition-all duration-300 hover:scale-[1.02]" id="canvas-container">
            <!-- QR Generated Here -->
          </div>
        </div>

        <!-- Download & Actions -->
        <div class="w-full mt-6 space-y-3">
          <div class="flex gap-2">
            <button id="btn-png" class="flex-1 py-3 bg-gradient-to-r from-cyan-400 to-sky-500 hover:from-cyan-300 hover:to-sky-400 text-slate-950 font-black rounded-xl shadow-lg shadow-cyan-500/20 active:scale-95 transition text-xs sm:text-sm flex items-center justify-center gap-1">
              <span>دانلود تصویر (PNG)</span>
            </button>
            <button id="btn-svg" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold rounded-xl border border-slate-700 active:scale-95 transition text-xs sm:text-sm flex items-center justify-center gap-1">
              <span>کیفیت چاپ (SVG)</span>
            </button>
          </div>
          
          <button id="btn-copy" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800 rounded-xl text-xs font-semibold transition active:scale-95">
            📋 کپی آدرس داخل QR
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    let logoDataUrl = "";
    let deferredPrompt = null;

    // PWA Install Prompt Listener
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('btn-install').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-banner').classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    // Initialize QR Code Engine
    const qrCode = new QRCodeStyling({
      width: 260,
      height: 260,
      type: "canvas",
      data: document.getElementById("qr-data").value,
      dotsOptions: {
        color: document.getElementById("qr-color").value,
        type: document.getElementById("dots-type").value
      },
      backgroundOptions: {
        color: document.getElementById("bg-color").value,
      },
      cornersSquareOptions: {
        type: document.getElementById("corners-type").value
      },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 6,
        imageSize: 0.35
      }
    });

    const container = document.getElementById("canvas-container");
    qrCode.append(container);

    function updateQR() {
      const rawText = document.getElementById("qr-data").value.trim();
      qrCode.update({
        data: rawText || " ",
        dotsOptions: {
          color: document.getElementById("qr-color").value,
          type: document.getElementById("dots-type").value
        },
        backgroundOptions: {
          color: document.getElementById("bg-color").value
        },
        cornersSquareOptions: {
          type: document.getElementById("corners-type").value
        },
        image: logoDataUrl || null
      });
    }

    // Input Actions
    document.getElementById("qr-data").addEventListener("input", updateQR);
    document.getElementById("dots-type").addEventListener("change", updateQR);
    document.getElementById("corners-type").addEventListener("change", updateQR);

    document.getElementById("qr-color").addEventListener("input", (e) => {
      document.getElementById("qr-color-val").textContent = e.target.value;
      updateQR();
    });

    document.getElementById("bg-color").addEventListener("input", (e) => {
      document.getElementById("bg-color-val").textContent = e.target.value;
      updateQR();
    });

    // Handle Logo Upload & Resize to base64
    document.getElementById("logo-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          logoDataUrl = reader.result;
          document.getElementById("remove-logo").classList.remove("hidden");
          updateQR();
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById("remove-logo").addEventListener("click", () => {
      logoDataUrl = "";
      document.getElementById("logo-input").value = "";
      document.getElementById("remove-logo").classList.add("hidden");
      updateQR();
    });

    // Downloads
    document.getElementById("btn-png").addEventListener("click", () => {
      qrCode.download({ name: "my-qrcode", extension: "png" });
    });

    document.getElementById("btn-svg").addEventListener("click", () => {
      qrCode.download({ name: "my-qrcode", extension: "svg" });
    });

    // Copy Content Button
    document.getElementById("btn-copy").addEventListener("click", () => {
      const text = document.getElementById("qr-data").value;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("btn-copy");
        btn.textContent = "✅ در حافظه کپی شد!";
        setTimeout(() => {
          btn.textContent = "📋 کپی آدرس داخل QR";
        }, 2000);
      });
    });

    // Register a dummy inline service worker to satisfy PWA installation criteria
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([
          `self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request).catch(function() { return caches.match(e.request); })); });`
        ], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
