<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QR Studio Pro Max</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR Studio" />
  <link rel="manifest" href="manifest.json" />
  
  <!-- CDN Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 75%, #000000 100%);
      background-attachment: fixed;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-panel {
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
    }

    #canvas-container canvas, #canvas-container svg {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 1rem;
    }
  </style>
</head>

<body class="text-slate-100 min-h-screen p-3 sm:p-6 md:p-8 flex flex-col items-center justify-start antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Mobile Install Banner -->
  <div id="install-banner" class="hidden w-full max-w-5xl mb-4 glass-card border-cyan-500/30 rounded-2xl p-3.5 flex items-center justify-between shadow-2xl transition-all">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-lg font-bold">
        ⚡
      </div>
      <div>
        <h4 class="font-bold text-xs sm:text-sm text-slate-200">نصب نسخه اپلیکیشن (PWA)</h4>
        <p class="text-[10px] sm:text-xs text-slate-400">دسترسی آفلاین و فوق‌سریع</p>
      </div>
    </div>
    <button id="btn-install" class="px-3.5 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/20 active:scale-95 transition">
      نصب اپ
    </button>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-4xl space-y-4 sm:space-y-6">
    
    <!-- Top Header -->
    <header class="text-center space-y-1.5 relative">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-300 text-[11px] font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        پشتیبانی کامل از زبان فارسی و UTF-8 استاندارد
      </div>
      <h1 class="text-2xl sm:text-4xl font-black bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent tracking-tight">
        استودیو همه‌کاره QR کد
      </h1>
    </header>

    <!-- Dropdown for Categories -->
    <div class="relative z-30" id="type-dropdown-container">
      <label class="block text-xs font-bold text-slate-400 mb-1.5 mr-1">نوع بارکد QR مورد نظر:</label>
      <button id="dropdown-toggle" type="button" class="w-full glass-card hover:border-cyan-500/50 rounded-2xl p-3 px-4 flex items-center justify-between text-slate-100 shadow-xl transition active:scale-[0.99] border border-slate-700/60">
        <div class="flex items-center gap-3">
          <span id="selected-icon" class="text-xl">🔗</span>
          <div class="text-right">
            <span id="selected-label" class="font-bold text-sm sm:text-base text-cyan-300">وب‌سایت و لینک اینترنتی</span>
            <span class="text-[10px] text-slate-400 block sm:inline sm:mr-2">برای تغییر نوع کلیک کنید</span>
          </div>
        </div>
        <div class="w-8 h-8 rounded-xl bg-slate-800/80 flex items-center justify-center text-cyan-400 text-xs transition duration-200" id="dropdown-arrow">
          ▼
        </div>
      </button>

      <!-- Dropdown Items Menu -->
      <div id="dropdown-menu" class="hidden absolute top-full right-0 left-0 mt-2 glass-panel border border-slate-700/80 rounded-2xl p-2 shadow-2xl z-40 max-h-80 overflow-y-auto backdrop-blur-2xl grid grid-cols-1 sm:grid-cols-2 gap-1.5">
        
        <button data-type="url" data-icon="🔗" data-title="وب‌سایت و لینک اینترنتی" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">🔗</span>
          <div>
            <div class="text-xs font-bold text-slate-100">وب‌سایت یا آدرس URL</div>
            <div class="text-[10px] text-slate-400">لینک مستقیم اینترنتی</div>
          </div>
        </button>

        <button data-type="bank" data-icon="💳" data-title="اطلاعات حساب بانکی و کارت" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">💳</span>
          <div>
            <div class="text-xs font-bold text-slate-100">اطلاعات حساب بانکی</div>
            <div class="text-[10px] text-slate-400">کارت، شماره شبا و حساب</div>
          </div>
        </button>

        <button data-type="text" data-icon="📝" data-title="متن دلخواه یا یادداشت" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📝</span>
          <div>
            <div class="text-xs font-bold text-slate-100">متن دلخواه (Text)</div>
            <div class="text-[10px] text-slate-400">پیام، شعر، یادداشت</div>
          </div>
        </button>

        <button data-type="wifi" data-icon="📶" data-title="اتصال خودکار به شبکه وای‌فای" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📶</span>
          <div>
            <div class="text-xs font-bold text-slate-100">وای‌فای (Wi-Fi)</div>
            <div class="text-[10px] text-slate-400">اتصال سریع بدون تایپ رمز</div>
          </div>
        </button>

        <button data-type="phone" data-icon="📞" data-title="شماره‌گیری مستقیم تماس" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📞</span>
          <div>
            <div class="text-xs font-bold text-slate-100">شماره تلفن (Call)</div>
            <div class="text-[10px] text-slate-400">شماره‌گیری سریع تماس</div>
          </div>
        </button>

        <button data-type="sms" data-icon="💬" data-title="ارسال پیامک آماده (SMS)" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">💬</span>
          <div>
            <div class="text-xs font-bold text-slate-100">پیامک (SMS)</div>
            <div class="text-[10px] text-slate-400">متن و شماره آماده</div>
          </div>
        </button>

        <button data-type="email" data-icon="✉️" data-title="ارسال ایمیل هوشمند" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">✉️</span>
          <div>
            <div class="text-xs font-bold text-slate-100">ایمیل (Email)</div>
            <div class="text-[10px] text-slate-400">گیرنده، موضوع و متن</div>
          </div>
        </button>

        <button data-type="vcard" data-icon="👤" data-title="کارت ویزیت مخاطب (vCard)" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">👤</span>
          <div>
            <div class="text-xs font-bold text-slate-100">مخاطب (vCard)</div>
            <div class="text-[10px] text-slate-400">ذخیره خودکار در گوشی</div>
          </div>
        </button>

        <button data-type="location" data-icon="📍" data-title="موقعیت جغرافیایی نقشه" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📍</span>
          <div>
            <div class="text-xs font-bold text-slate-100">لوکیشن (Map)</div>
            <div class="text-[10px] text-slate-400">مسیریابی با نقشه</div>
          </div>
        </button>

        <button data-type="event" data-icon="📅" data-title="ثبت رویداد در تقویم" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">📅</span>
          <div>
            <div class="text-xs font-bold text-slate-100">رویداد (Calendar)</div>
            <div class="text-[10px] text-slate-400">زمان‌بندی و جلسه</div>
          </div>
        </button>

        <button data-type="crypto" data-icon="🪙" data-title="کیف پول ارز دیجیتال" class="dropdown-item w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-500/30 border border-transparent text-right transition">
          <span class="text-xl">🪙</span>
          <div>
            <div class="text-xs font-bold text-slate-100">کریپتو (Crypto)</div>
            <div class="text-[10px] text-slate-400">بیت‌کوین، تتر و اتریوم</div>
          </div>
        </button>

      </div>
    </div>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 glass-card rounded-3xl p-4 sm:p-6 shadow-2xl relative z-10">
      
      <!-- Input Controls (Column 1) -->
      <div class="lg:col-span-7 space-y-4">
        
        <!-- Dynamic Forms Container -->
        <div class="glass-panel p-4 rounded-2xl border border-slate-800/80 shadow-inner">
          
          <!-- 1. URL -->
          <div id="form-url" class="type-form space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">آدرس وب‌سایت یا لینک اینترنتی</label>
            <input type="text" id="input-url" placeholder="https://example.com" value="https://google.com" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 text-white text-left font-mono text-xs sm:text-sm transition" />
          </div>

          <!-- 2. BANK -->
          <div id="form-bank" class="type-form hidden space-y-3">
            <label class="block text-xs font-bold text-slate-300">اطلاعات حساب بانکی و کارت</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="bank-holder" placeholder="نام و نام خانوادگی صاحب حساب" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="text" id="bank-name" placeholder="نام بانک (مثلاً ملت، سامان...)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            </div>
            <div class="space-y-2">
              <div>
                <label class="text-[11px] text-slate-400 block mb-1">شماره کارت (۱۶ رقمی):</label>
                <input type="text" id="bank-card" placeholder="6037-xxxx-xxxx-xxxx" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs sm:text-sm transition tracking-wider" />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1">شماره حساب:</label>
                  <input type="text" id="bank-acc" placeholder="شماره حساب" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs sm:text-sm transition" />
                </div>
                <div>
                  <label class="text-[11px] text-slate-400 block mb-1">شماره شبا (IBAN):</label>
                  <input type="text" id="bank-iban" placeholder="IR000000000000000000000000" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs sm:text-sm transition" />
                </div>
              </div>
            </div>
          </div>

          <!-- 3. TEXT -->
          <div id="form-text" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">متن دلخواه یا یادداشت فارسی</label>
            <textarea id="input-text" rows="3" placeholder="متن مورد نظرتان را اینجا بنویسید..." class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
          </div>

          <!-- 4. WIFI -->
          <div id="form-wifi" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">مشخصات شبکه وای‌فای</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="wifi-ssid" placeholder="نام شبکه (SSID)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="text" id="wifi-pass" placeholder="رمز عبور وای‌فای" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            </div>
            <div class="flex items-center gap-4 text-xs text-slate-300 pt-1">
              <span class="font-semibold text-slate-400">نوع امنیت:</span>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="wifi-type" value="WPA" checked class="text-cyan-500" />
                <span>WPA/WPA2</span>
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="wifi-type" value="WEP" class="text-cyan-500" />
                <span>WEP</span>
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="wifi-type" value="nopass" class="text-cyan-500" />
                <span>بدون رمز</span>
              </label>
            </div>
          </div>

          <!-- 5. PHONE -->
          <div id="form-phone" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">شماره تماس جهت شماره‌گیری مستقیم</label>
            <input type="tel" id="input-phone" placeholder="0912xxxxxxx" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
          </div>

          <!-- 6. SMS -->
          <div id="form-sms" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">ارسال پیامک آماده</label>
            <input type="tel" id="sms-phone" placeholder="شماره گیرنده" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm mb-1.5 transition" />
            <textarea id="sms-body" rows="2" placeholder="متن پیش‌فرض پیامک..." class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
          </div>

          <!-- 7. EMAIL -->
          <div id="form-email" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">ارسال ایمیل</label>
            <input type="email" id="email-to" placeholder="آدرس ایمیل گیرنده" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
            <input type="text" id="email-subject" placeholder="موضوع ایمیل" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            <textarea id="email-body" rows="2" placeholder="متن پیام..." class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition"></textarea>
          </div>

          <!-- 8. VCARD / CONTACT -->
          <div id="form-vcard" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">کارت ویزیت مخاطب (vCard با پشتیبانی فارسی)</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input type="text" id="vcard-fn" placeholder="نام و نام خانوادگی" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
              <input type="tel" id="vcard-tel" placeholder="شماره تماس" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left font-mono text-xs sm:text-sm transition" />
              <input type="email" id="vcard-email" placeholder="ایمیل" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-left text-xs sm:text-sm transition" />
              <input type="text" id="vcard-org" placeholder="نام شرکت / سازمان" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            </div>
          </div>

          <!-- 9. LOCATION -->
          <div id="form-location" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">مختصات نقشه</label>
            <div class="grid grid-cols-2 gap-2.5">
              <input type="number" step="any" id="loc-lat" placeholder="عرض (Lat) 35.6892" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-xs sm:text-sm transition" />
              <input type="number" step="any" id="loc-lng" placeholder="طول (Lng) 51.3890" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-xs sm:text-sm transition" />
            </div>
          </div>

          <!-- 10. EVENT -->
          <div id="form-event" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">ثبت رویداد در تقویم</label>
            <input type="text" id="event-title" placeholder="عنوان رویداد یا جلسه" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <span class="text-[10px] text-slate-400 block mb-1">زمان شروع:</span>
                <input type="datetime-local" id="event-start" class="w-full px-3 py-1.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs transition" />
              </div>
              <div>
                <span class="text-[10px] text-slate-400 block mb-1">زمان پایان:</span>
                <input type="datetime-local" id="event-end" class="w-full px-3 py-1.5 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs transition" />
              </div>
            </div>
            <input type="text" id="event-location" placeholder="محل برگزاری (اختیاری)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white text-xs sm:text-sm transition" />
          </div>

          <!-- 11. CRYPTO -->
          <div id="form-crypto" class="type-form hidden space-y-2.5">
            <label class="block text-xs font-bold text-slate-300">درگاه پرداخت و والت رمزارز</label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">

            <input type="number" step="any" id="crypto-amount" placeholder="مقدار پیش‌فرض (اختیاری)" class="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/70 rounded-xl focus:border-cyan-400 text-white font-mono text-left text-xs transition" />

              <option value="extra-rounded" selected>گوشه‌های کاملاً گرد</option>
              <option value="dot">دایره‌ای (Dot)</option>

        <!-- Margin & Resolution -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">حاشیه امن (Quiet Zone)</label>
            <select id="qr-margin" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700/70 rounded-xl text-slate-200 text-xs sm:text-sm transition">
              <option value="15">حاشیه ملایم (15px)</option>
              <option value="25" selected>حاشیه استاندارد چاپ (25px)</option>
              <option value="35">حاشیه عریض (35px)</option>
              <option value="0">بدون حاشیه (0px)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1.5">کیفیت خروجی (رزولوشن)</label>
            <select id="qr-size" class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700/70 rounded-xl text-slate-200 text-xs sm:text-sm transition">
              <option value="1200">مناسب وب - 1200px</option>
              <option value="2000" selected>فوق شفاف چاپ - 2000px</option>
              <option value="3000">اولترا HD بنر - 3000px</option>

        <!-- Color Palette -->
        <div class="grid grid-cols-2 gap-3">
          <div class="glass-panel p-3 rounded-2xl border border-slate-800/80 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-300">رنگ کد</span>
            <div class="flex items-center gap-2">
              <input type="color" id="qr-color" value="#000000" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border border-slate-700/80" />
              <span id="qr-color-val" class="font-mono text-xs text-slate-300 uppercase font-semibold">#000000</span>
            </div>
          </div>

          <div class="glass-panel p-3 rounded-2xl border border-slate-800/80 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-300">رنگ زمینه</span>
            <div class="flex items-center gap-2">
              <input type="color" id="bg-color" value="#ffffff" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent border border-slate-700/80" />
              <span id="bg-color-val" class="font-mono text-xs text-slate-300 uppercase font-semibold">#FFFFFF</span>

            <span class="block text-[10px] text-slate-400">بدون کاهش خوانایی</span>
          </div>
          <div class="flex items-center gap-2">
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/20 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 active:scale-95 shadow-sm">
              <span>انتخاب لوگو</span>
              <input type="file" id="logo-input" accept="image/*" class="hidden" />

            <span class="text-[10px] bg-cyan-950/80 border border-cyan-800/50 text-cyan-300 px-2 py-0.5 rounded-full font-mono font-bold">Ultra Crisp</span>
          </div>

          <!-- QR Canvas Container -->
          <div class="p-3 bg-slate-900/90 rounded-3xl glow-cyan flex items-center justify-center max-w-[260px] w-full aspect-square border border-slate-700/60 transition-all duration-300 overflow-hidden" id="canvas-container">
            <!-- QR Generated Here -->
          </div>

        <!-- Download & Actions -->
        <div class="w-full mt-5 space-y-2.5">

            </button>
            <button id="btn-svg" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold rounded-xl border border-slate-700/80 active:scale-95 transition text-xs sm:text-sm flex items-center justify-center gap-1">

            </button>

          <button id="btn-copy" class="w-full py-2 bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800 rounded-xl text-xs font-semibold transition active:scale-95">

          </button>

  <script>
    let activeType = "url";
    let logoDataUrl = "";
    let deferredPrompt = null;

    // Fix UTF-8 Encoding for accurate rendering across all mobile scanners
    function toUTF8(str) {
      if (!str) return "";
      return unescape(encodeURIComponent(str));
    }

    function escapeWifi(str) {
      return String(str || "").replace(/([\\;,:"])/g, "\\$1");
    }

    function escapeVCard(str) {
      return String(str || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
    }

    function escapeICal(str) {
      return String(str || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
    }

    function formatISODate(dtValue) {
      if (!dtValue) return "";
      try {
        const d = new Date(dtValue);
        if (isNaN(d.getTime())) return "";
        return d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      } catch (e) {
        return "";
      }
    }

    // PWA Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.classList.remove('hidden');
    });

    document.getElementById('btn-install').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-banner').classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    // Custom Dropdown Logic
    const dropdownToggle = document.getElementById("dropdown-toggle");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const dropdownArrow = document.getElementById("dropdown-arrow");
    const selectedIcon = document.getElementById("selected-icon");
    const selectedLabel = document.getElementById("selected-label");

    dropdownToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const isHidden = dropdownMenu.classList.contains("hidden");
      if (isHidden) {
        dropdownMenu.classList.remove("hidden");
        dropdownArrow.style.transform = "rotate(180deg)";
      } else {
        dropdownMenu.classList.add("hidden");
        dropdownArrow.style.transform = "rotate(0deg)";
      }
    });

    // Close Dropdown on outer click
    document.addEventListener("click", () => {
      dropdownMenu.classList.add("hidden");
      dropdownArrow.style.transform = "rotate(0deg)";
    });

    // Dropdown items click
    const dropdownItems = document.querySelectorAll(".dropdown-item");
    dropdownItems.forEach(item => {
      item.addEventListener("click", () => {
        activeType = item.getAttribute("data-type");
        const icon = item.getAttribute("data-icon");
        const title = item.getAttribute("data-title");

        selectedIcon.textContent = icon;
        selectedLabel.textContent = title;

        // Hide all forms and show active one
        document.querySelectorAll(".type-form").forEach(f => f.classList.add("hidden"));
        const targetForm = document.getElementById(`form-${activeType}`);
        if (targetForm) targetForm.classList.remove("hidden");

        dropdownMenu.classList.add("hidden");
        dropdownArrow.style.transform = "rotate(0deg)";

        updateQR();
      });
    });

    // Generate Standard Raw Content
    function getRawPayload() {
      switch(activeType) {
        case "url": {
          let url = (document.getElementById("input-url").value || "").trim();
          if (!url) return "https://google.com";
          if (!/^https?:\/\//i.test(url) && !url.startsWith("mailto:") && !url.startsWith("tel:")) {
            url = "https://" + url;
          }
          return url;
        }

        case "bank": {
          const bHolder = (document.getElementById("bank-holder").value || "").trim();
          const bBank = (document.getElementById("bank-name").value || "").trim();
          const bCard = (document.getElementById("bank-card").value || "").trim();
          const bAcc = (document.getElementById("bank-acc").value || "").trim();
          let bIban = (document.getElementById("bank-iban").value || "").trim().toUpperCase();
          if (bIban && !bIban.startsWith("IR")) {
            bIban = "IR" + bIban;
          }

          let bankLines = [];
          if (bHolder) bankLines.push(`صاحب حساب: ${bHolder}`);
          if (bBank) bankLines.push(`بانک: ${bBank}`);
          if (bCard) bankLines.push(`شماره کارت:\n${bCard}`);
          if (bAcc) bankLines.push(`شماره حساب:\n${bAcc}`);
          if (bIban) bankLines.push(`شماره شبا:\n${bIban}`);

          return bankLines.length > 0 ? bankLines.join("\n\n") : "اطلاعات حساب بانکی";
        }

        case "text":
          return (document.getElementById("input-text").value || "").trim() || " ";

        case "wifi": {
          const ssid = escapeWifi(document.getElementById("wifi-ssid").value.trim());
          const pass = escapeWifi(document.getElementById("wifi-pass").value.trim());
          const encChecked = document.querySelector('input[name="wifi-type"]:checked');
          const enc = encChecked ? encChecked.value : "WPA";
          if (enc === "nopass") {
            return `WIFI:T:nopass;S:${ssid};;`;
          }
          return `WIFI:T:${enc};S:${ssid};P:${pass};;`;
        }

        case "phone": {
          const tel = (document.getElementById("input-phone").value || "").trim();
          return `tel:${tel}`;
        }

        case "sms": {
          const smsNum = (document.getElementById("sms-phone").value || "").trim();
          const smsBody = (document.getElementById("sms-body").value || "").trim();
          return `SMSTO:${smsNum}:${smsBody}`;
        }

        case "email": {
          const to = (document.getElementById("email-to").value || "").trim();
          const sub = encodeURIComponent((document.getElementById("email-subject").value || "").trim());
          const body = encodeURIComponent((document.getElementById("email-body").value || "").trim());
          return `mailto:${to}?subject=${sub}&body=${body}`;
        }

        case "vcard": {
          const fn = escapeVCard((document.getElementById("vcard-fn").value || "").trim());
          const vtel = escapeVCard((document.getElementById("vcard-tel").value || "").trim());
          const vemail = escapeVCard((document.getElementById("vcard-email").value || "").trim());
          const vorg = escapeVCard((document.getElementById("vcard-org").value || "").trim());
          
          let vcardLines = ["BEGIN:VCARD", "VERSION:3.0"];
          if (fn) vcardLines.push(`FN;CHARSET=UTF-8:${fn}`);
          if (vorg) vcardLines.push(`ORG;CHARSET=UTF-8:${vorg}`);
          if (vtel) vcardLines.push(`TEL;TYPE=CELL:${vtel}`);
          if (vemail) vcardLines.push(`EMAIL:${vemail}`);
          vcardLines.push("END:VCARD");
          
          return vcardLines.join("\r\n");
        }

        case "location": {
          const lat = (document.getElementById("loc-lat").value || "").trim() || "35.6892";
          const lng = (document.getElementById("loc-lng").value || "").trim() || "51.3890";
          return `https://www.google.com/maps?q=${lat},${lng}`;
        }

        case "event": {
          const title = escapeICal((document.getElementById("event-title").value || "").trim() || "رویداد");
          const startVal = document.getElementById("event-start").value;
          const endVal = document.getElementById("event-end").value;
          const start = formatISODate(startVal);
          const end = formatISODate(endVal);
          const eloc = escapeICal((document.getElementById("event-location").value || "").trim());

          let ical = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\n";
          ical += `SUMMARY;CHARSET=UTF-8:${title}\r\n`;
          if (start) ical += `DTSTART:${start}\r\n`;
          if (end) ical += `DTEND:${end}\r\n`;
          if (eloc) ical += `LOCATION;CHARSET=UTF-8:${eloc}\r\n`;
          ical += "END:VEVENT\r\nEND:VCALENDAR";
          return ical;
        }

        case "crypto": {
          const coin = document.getElementById("crypto-coin").value;
          const addr = (document.getElementById("crypto-address").value || "").trim();
          const amt = (document.getElementById("crypto-amount").value || "").trim();
          if (coin === "bitcoin") return `bitcoin:${addr}${amt ? '?amount='+amt : ''}`;
          if (coin === "ethereum") return `ethereum:${addr}${amt ? '?value='+amt : ''}`;
          return `${coin}:${addr}${amt ? '?amount='+amt : ''}`;
        }

        default:
          return "https://google.com";
      }
    }

    // Get Payload prepared for QR Code Styling
    function getQrPayload() {
      const raw = getRawPayload();
      return toUTF8(raw);
    }

    function getSelectedMargin() {
      const marginEl = document.getElementById("qr-margin");
      if (!marginEl) return 25;
      const parsed = parseInt(marginEl.value, 10);
      return isNaN(parsed) ? 25 : parsed;
    }

    // Initialize QR Code Styling Engine
    const qrCode = new QRCodeStyling({
      width: 230,
      height: 230,
      margin: getSelectedMargin(),
      type: "canvas",
      data: getQrPayload(),
      qrOptions: {
        errorCorrectionLevel: "Q"
      },
      dotsOptions: {
        color: document.getElementById("qr-color").value,
        type: document.getElementById("dots-type").value
      },
      backgroundOptions: {
        color: document.getElementById("bg-color").value,
      },
      cornersSquareOptions: {
        type: document.getElementById("corners-type").value
      },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 4,
        imageSize: 0.35
      }
    });

    const container = document.getElementById("canvas-container");
    qrCode.append(container);

    function updateQR() {
      try {
        qrCode.update({
          data: getQrPayload(),
          margin: getSelectedMargin(),
          dotsOptions: {
            color: document.getElementById("qr-color").value,
            type: document.getElementById("dots-type").value
          },
          backgroundOptions: {
            color: document.getElementById("bg-color").value
          },
          cornersSquareOptions: {
            type: document.getElementById("corners-type").value
          },
          image: logoDataUrl || null
        });
      } catch (err) {
        console.warn("QR Render Warning:", err);
      }
    }

    // Inputs Listeners
    document.querySelectorAll("input, select, textarea").forEach(input => {
      input.addEventListener("input", updateQR);
      input.addEventListener("change", updateQR);
    });

    document.getElementById("qr-color").addEventListener("input", (e) => {
      document.getElementById("qr-color-val").textContent = e.target.value.toUpperCase();
      updateQR();
    });

    document.getElementById("bg-color").addEventListener("input", (e) => {
      document.getElementById("bg-color-val").textContent = e.target.value.toUpperCase();
      updateQR();
    });

    // Logo Upload / Remove
    document.getElementById("logo-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          logoDataUrl =color: document.getElementById("bg-color").value,
      },
      cornersSquareOptions: {
        type: document.getElementById("corners-type").value
      },
      imageOptions: {
        crossOrigin: "anonymous",
        margin: 4,
        imageSize: 0.35
      }
    });

    const container = document.getElementById("canvas-container");
    qrCode.append(container);

    function updateQR() {
      try {
        qrCode.update({
          data: getQrPayload(),
          margin: getSelectedMargin(),
          dotsOptions: {
            color: document.getElementById("qr-color").value,
            type: document.getElementById("dots-type").value
          },
          backgroundOptions: {
            color: document.getElementById("bg-color").value
          },
          cornersSquareOptions: {
            type: document.getElementById("corners-type").value
          },
          image: logoDataUrl || null
        });
      } catch (err) {
        console.warn("QR Render Warning:", err);
      }
    }

    // Inputs Listeners
    document.querySelectorAll("input, select, textarea").forEach(input => {
      input.addEventListener("input", updateQR);
      input.addEventListener("change", updateQR);
    });

    document.getElementById("qr-color").addEventListener("input", (e) => {
      document.getElementById("qr-color-val").textContent = e.target.value.toUpperCase();
      updateQR();
    });

    document.getElementById("bg-color").addEventListener("input", (e) => {
      document.getElementById("bg-color-val").textContent = e.target.value.toUpperCase();
      updateQR();
    });

    // Logo Upload / Remove
    document.getElementById("logo-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          logoDataUrl = {
      const payload = getRawPayload();
      const btn = document.getElementById("btn-copy");

      const showSuccess = () => {
        btn.textContent = "✅ در حافظه کپی شد!";
        setTimeout(() => {
          btn.textContent = "📋 کپی متن/محتوای QR";
        }, 2000);
      };

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(payload);
          showSuccess();
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = payload;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
          showSuccess();
        }
      } catch (err) {
        alert("خطا در کپی خودکار، لطفاً دستی کپی کنید.");
      }
    });

    // Standard PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((err) => {
          console.log('SW registration skipped in local mode.');
        });
      });
    }
  </script>
